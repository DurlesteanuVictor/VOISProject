<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <link rel="stylesheet" href="Checkout.css" />
</head>
<body>

  <header class="checkout-header">
    <a href="../Menu/Menu.html" class="checkout-logo">FixFlex</a>
  </header>

  <div class="step-indicator">
    <div class="step completed">
      <div class="step-circle">&#10003;</div>
      <span class="step-label">Service</span>
    </div>
    <div class="step-line completed"></div>
    <div class="step active">
      <div class="step-circle">2</div>
      <span class="step-label">Details</span>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-circle">3</div>
      <span class="step-label">Confirmation</span>
    </div>
  </div>

  <main class="checkout-content">

    <div class="checkout-left">

      <div class="company-preview">
        <img class="company-preview-image" src="company-placeholder.png" alt="Company" id="company-image" />
        <div class="company-preview-body">
          <h2 class="company-preview-name" id="company-name">Company name</h2>
          <div class="company-preview-rating">
            <span class="rating-number" id="company-rating">-</span>
            <span class="stars" id="company-stars"></span>
          </div>
          <p class="company-preview-location" id="company-location">&#128205; Location unavailable</p>
          <p class="company-preview-description" id="company-description">No description available.</p>
        </div>
      </div>

      <div class="booking-details">
        <h3 class="booking-details-title">Booking Details</h3>

        <div class="detail-row">
          <span class="detail-label">Date</span>
          <span class="detail-value" id="checkout-date">Not specified</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Time</span>
          <div class="hour-dropdown" id="hour-dropdown">
            <button type="button" class="hour-dropdown-toggle" id="hour-dropdown-toggle">Select a time</button>
            <div class="hour-dropdown-list hidden" id="hour-dropdown-list"></div>
          </div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Price</span>
          <span class="detail-value price-value" id="checkout-price">-</span>
        </div>
      </div>

    </div>

    <div class="checkout-right" id="checkout-right">
      <h2 class="checkout-form-title">Enter Your Details</h2>

      <form id="checkout-form">
        <div class="input-group">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="Enter your address" required />
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required />
          </div>
          <div class="input-group">
            <label for="postalCode">Postal Code</label>
            <input type="text" id="postalCode" name="postalCode" required />
          </div>
        </div>

        <div class="input-group">
          <label for="country">Country</label>
          <input type="text" id="country" name="country" required />
        </div>

        <div class="input-group">
          <label for="car-select">Select Your Car</label>
          <select id="car-select" name="car" required>
            <option value="">Loading cars...</option>
          </select>
        </div>

        <p class="form-error" id="form-error"></p>

        <button type="button" class="next-step-btn" id="next-step-btn">
          <span id="next-step-btn-text">Next Step</span>
        </button>
      </form>
    </div>

  </main>

  <script src="Checkout.js"></script>
</body>
</html>
