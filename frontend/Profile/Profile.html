<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <link rel="stylesheet" href="Profile.css" />
</head>
<body>
  <div class="profile-container">
    <h1 class="profile-title">My Profile</h1>
    
    <div class="avatar-section-left">
      <img src="profile-placeholder.png" alt="Profile picture" class="profile-avatar" id="avatar-preview" />
      <label for="avatar-upload" class="avatar-upload-label">Change photo</label>
      <input type="file" id="avatar-upload" accept="image/*" hidden />
    </div>

    <div class="accordion-item">
      <div class="accordion-header" onclick="toggleAccordion('personal-info-content', this)">
        <h2>Personal Info</h2>
        <span class="toggle-icon">+</span>
      </div>
      <div class="accordion-content" id="personal-info-content">
        <form id="profile-form">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="Ion Popescu" readonly />
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="ion.popescu@email.com" readonly />
          </div>
          <div class="input-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" value="0700123456" readonly />
          </div>
          
          <button type="button" class="profile-btn secondary-btn" id="edit-btn">Change profile</button>
          
          <div id="action-buttons" class="action-buttons-container">
            <button type="submit" class="profile-btn save-btn" id="save-btn">Save Changes</button>
            <button type="button" class="profile-btn cancel-btn" id="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div class="accordion-item section-my-car">
      <div class="my-car-main-header">
        <h2>My Car</h2>
        <button type="button" class="add-car-btn" onclick="document.getElementById('add-car-form-container').style.display = 'block';">Add</button>
      </div>
      
      <div id="add-car-form-container" class="add-car-form-container">
        <h3>Add a new car</h3>
        <form id="add-car-form">
          <div class="input-row">
            <div class="input-group">
              <label for="newCarMake">Make</label>
              <input type="text" id="newCarMake" name="newCarMake" placeholder="e.g. Dacia" required />
            </div>
            <div class="input-group">
              <label for="newCarModel">Model</label>
              <input type="text" id="newCarModel" name="newCarModel" placeholder="e.g. Duster" required />
            </div>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label for="newCarYear">Year</label>
              <input type="number" id="newCarYear" name="newCarYear" placeholder="e.g. 2022" required />
            </div>
            <div class="input-group">
              <label for="newCarEngine">Engine</label>
              <input type="text" id="newCarEngine" name="newCarEngine" placeholder="e.g. 1.3 TCe" required />
            </div>
          </div>
          <div class="add-car-actions">
            <button type="submit" class="profile-btn save-btn">Save Car</button>
            <button type="button" class="profile-btn cancel-btn" onclick="document.getElementById('add-car-form-container').style.display = 'none';">Cancel</button>
          </div>
        </form>
      </div>
      
      <div class="inner-car-item">
        <div class="accordion-header">
          <h3>Dacia Logan</h3>
          <div class="car-actions">
            <button type="button" class="delete-btn">Delete</button>
            <span class="toggle-icon" onclick="toggleAccordion('car-1-content', this)">+</span>
          </div>
        </div>
        <div class="accordion-content" id="car-1-content">
           <div class="input-row">
             <div class="input-group">
               <label>Year</label>
               <input type="number" value="2015" readonly />
             </div>
             <div class="input-group">
               <label>Engine</label>
               <input type="text" value="1.5 dCi" readonly />
             </div>
           </div>
        </div>
      </div>

      <div class="inner-car-item">
        <div class="accordion-header">
          <h3>Volkswagen Golf</h3>
          <div class="car-actions">
            <button type="button" class="delete-btn">Delete</button>
            <span class="toggle-icon" onclick="toggleAccordion('car-2-content', this)">+</span>
          </div>
        </div>
        <div class="accordion-content" id="car-2-content">
           <div class="input-row">
             <div class="input-group">
               <label>Year</label>
               <input type="number" value="2018" readonly />
             </div>
             <div class="input-group">
               <label>Engine</label>
               <input type="text" value="2.0 TDI" readonly />
             </div>
           </div>
        </div>
      </div>
    </div>

    <div class="accordion-item">
      <div class="accordion-header" onclick="toggleAccordion('password-content', this)">
        <h2>Change password</h2>
        <span class="toggle-icon">+</span>
      </div>
      <div class="accordion-content" id="password-content">
        <form id="password-form">
          <div class="input-group">
            <label for="currentPassword">Current password</label>
            <div class="password-wrapper">
              <input type="password" id="currentPassword" name="currentPassword" required />
              <button type="button" class="toggle-btn" data-target="currentPassword">Show</button>
            </div>
          </div>
          <div class="input-group">
            <label for="newPassword">New password</label>
            <div class="password-wrapper">
              <input type="password" id="newPassword" name="newPassword" required />
              <button type="button" class="toggle-btn" data-target="newPassword">Show</button>
            </div>
          </div>
          <button type="submit" class="profile-btn">Update password</button>
        </form>
      </div>
    </div>

    <div class="accordion-item">
      <div class="accordion-header" onclick="toggleAccordion('history-content', this)">
        <h2>History</h2>
        <span class="toggle-icon">+</span>
      </div>
      <div class="accordion-content" id="history-content">
        <p class="history-empty-text">No history available.</p>
      </div>
    </div>

    <button type="button" class="profile-btn logout-btn main-logout-btn" id="logout-btn">Log out</button>
  </div>

  <script>
    function toggleAccordion(contentId, headerElement) {
      const content = document.getElementById(contentId);
      const icon = headerElement.querySelector('.toggle-icon');
      
      if (content.style.display === 'block') {
        content.style.display = 'none';
        icon.textContent = '+';
      } else {
        content.style.display = 'block';
        icon.textContent = '-';
      }
    }
  </script>
  <script src="Profile.js"></script>
</body>
</html>
