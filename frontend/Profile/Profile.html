<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <link rel="stylesheet" href="Profile.css" />
</head>
<body>

  <div class="profile-container">
    <h1 class="profile-title">My Profile</h1>

    <div class="avatar-section">
      <img src="profile-placeholder.png" alt="Profile picture" class="profile-avatar" id="avatar-preview" />
      <label for="avatar-upload" class="avatar-upload-label">Change photo</label>
      <input type="file" id="avatar-upload" accept="image/*" hidden />
    </div>

    <form id="profile-form">

      <h2 class="section-title">Personal info</h2>
      <div class="input-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Introduce name" />
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Introduce email" />
      </div>

      <div class="input-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Introduce phone number" />
      </div>

      <h2 class="section-title">Address</h2>
      <div class="input-group">
        <label for="street">Street address</label>
        <input type="text" id="street" name="street" placeholder="Introduce street address" />
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="City" />
        </div>

        <div class="input-group">
          <label for="postalCode">Postal code</label>
          <input type="text" id="postalCode" name="postalCode" placeholder="Postal code" />
        </div>
      </div>
    </form>

    <h2 class="section-title">Payment details</h2>
    <div class="saved-card">
      <div class="saved-card-info">
        <span class="card-label">Saved card</span>
        <span class="card-number">**** **** **** 4242</span>
        <span class="card-expiry">Expires 08/28</span>
      </div>
      <button type="button" class="remove-card-btn" id="remove-card-btn">Remove</button>
    </div>
    <button type="button" class="profile-btn secondary-btn" id="add-card-btn">Add new card</button>

    <h2 class="section-title">Change password</h2>
    <form id="password-form">
      <div class="input-group">
        <label for="currentPassword">Current password</label>
        <div class="password-wrapper">
          <input type="password" id="currentPassword" name="currentPassword" placeholder="Introduce current password" required />
          <button type="button" class="toggle-btn" data-target="currentPassword">Show</button>
        </div>
      </div>

      <div class="input-group">
        <label for="newPassword">New password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" name="newPassword" placeholder="Introduce new password" required />
          <button type="button" class="toggle-btn" data-target="newPassword">Show</button>
        </div>
      </div>

      <button type="submit" class="profile-btn">Update password</button>
    </form>

    <button type="submit" form="profile-form" class="profile-btn save-btn">Save changes</button>

    <button type="button" class="profile-btn logout-btn" id="logout-btn">Log out</button>

  </div>

  <script src="Profile.js"></script>
</body>
</html>
