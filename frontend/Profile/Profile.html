<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <link rel="stylesheet" href="Profile.css" />
</head>
<body>

  <div class="profile-container">
    <h1 class="profile-title">My Profile</h1>

    <div class="avatar-section">
      <img src="profile-placeholder.png" alt="Profile picture" class="profile-avatar" id="avatar-preview" />
      <label for="avatar-upload" class="avatar-upload-label">Change photo</label>
      <input type="file" id="avatar-upload" accept="image/*" hidden />
    </div>

    <form id="profile-form">

      <h2 class="section-title">Personal info</h2>
      <div class="input-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Introduce name" />
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Introduce email" />
      </div>

      <div class="input-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Introduce phone number" />
      </div>

      <h2 class="section-title">Car details</h2>
      <div class="input-row">
        <div class="input-group">
          <label for="carMake">Manufacturer</label>
          <input type="text" id="carMake" name="carMake" placeholder="e.g. Volkswagen" list="carMakeList" autocomplete="off" />
          <datalist id="carMakeList"></datalist>
        </div>

        <div class="input-group">
          <label for="carModel">Model</label>
          <input type="text" id="carModel" name="carModel" placeholder="Select manufacturer first" list="carModelList" autocomplete="off" />
          <datalist id="carModelList"></datalist>
        </div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="carYear">Year</label>
          <input type="text" id="carYear" name="carYear" placeholder="e.g. 2018" list="carYearList" inputmode="numeric" autocomplete="off" />
          <datalist id="carYearList"></datalist>
        </div>

        <div class="input-group">
          <label for="carEnginePower">Engine power</label>
          <input type="text" id="carEnginePower" name="carEnginePower" placeholder="e.g. 2.0" list="carEnginePowerList" autocomplete="off" />
          <datalist id="carEnginePowerList"></datalist>
        </div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="carEngineType">Engine type</label>
          <select id="carEngineType" name="carEngineType">
            <option value="">Engine type</option>
            <option value="petrol">Petrol</option>
            <option value="diesel">Diesel</option>
            <option value="hybrid">Hybrid</option>
            <option value="electric">Electric</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="input-group">
          <label for="carTransmission">Transmission</label>
          <select id="carTransmission" name="carTransmission">
            <option value="">Transmission</option>
            <option value="manual">Manual</option>
            <option value="automatic">Automatic</option>
          </select>
        </div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="carPlate">License plate</label>
          <input type="text" id="carPlate" name="carPlate" placeholder="e.g. IS 01 ABC" />
        </div>

        <div class="input-group">
          <label for="carMileage">Mileage (km)</label>
          <input type="text" id="carMileage" name="carMileage" placeholder="e.g. 85000" inputmode="numeric" pattern="[0-9]*" />
        </div>
      </div>

      <h2 class="section-title">Address</h2>
      <div class="input-group">
        <label for="street">Street address</label>
        <input type="text" id="street" name="street" placeholder="Introduce street address" />
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="City" />
        </div>

        <div class="input-group">
          <label for="postalCode">Postal code</label>
          <input type="text" id="postalCode" name="postalCode" placeholder="Postal code" />
        </div>
      </div>
    </form>

    <h2 class="section-title">Payment details</h2>
    <div class="saved-card">
      <div class="saved-card-info">
        <span class="card-label">Saved card</span>
        <span class="card-number">**** **** **** 4242</span>
        <span class="card-expiry">Expires 08/28</span>
      </div>
      <button type="button" class="remove-card-btn" id="remove-card-btn">Remove</button>
    </div>
    <button type="button" class="profile-btn secondary-btn" id="add-card-btn">Add new card</button>

    <h2 class="section-title">Change password</h2>
    <form id="password-form">
      <div class="input-group">
        <label for="currentPassword">Current password</label>
        <div class="password-wrapper">
          <input type="password" id="currentPassword" name="currentPassword" placeholder="Introduce current password" required />
          <button type="button" class="toggle-btn" data-target="currentPassword">Show</button>
        </div>
      </div>

      <div class="input-group">
        <label for="newPassword">New password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" name="newPassword" placeholder="Introduce new password" required />
          <button type="button" class="toggle-btn" data-target="newPassword">Show</button>
        </div>
      </div>

      <button type="submit" class="profile-btn">Update password</button>
    </form>

    <button type="submit" form="profile-form" class="profile-btn save-btn">Save changes</button>

    <button type="button" class="profile-btn logout-btn" id="logout-btn">Log out</button>

  </div>

  <script src="Profile.js"></script>
</body>
</html>
