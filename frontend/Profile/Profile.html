<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <link rel="stylesheet" href="Profile.css" />
</head>
<body>
  <div class="profile-dashboard">

    <aside class="profile-sidebar">
      <a href="../Menu/Menu.html" class="fixflex-logo">FixFlex</a>

      <div class="avatar-section-left">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23dddddd'/><circle cx='50' cy='40' r='18' fill='%23a8a8a8'/><path d='M50 62c-20 0-32 12-32 26v12h64V88c0-14-12-26-32-26z' fill='%23a8a8a8'/></svg>" alt="Profile picture" class="profile-avatar" id="avatar-preview" />
        <label for="avatar-upload" class="avatar-upload-label">Change photo</label>
        <input type="file" id="avatar-upload" accept="image/*" hidden />
      </div>

      <nav class="profile-nav">
        <button type="button" class="nav-item active" data-tab="personal-info-content" onclick="switchTab(this, 'personal-info-content')">Personal Info</button>
        <button type="button" class="nav-item" id="nav-my-car" data-tab="section-my-car" onclick="switchTab(this, 'section-my-car')">My Car</button>
        <button type="button" class="nav-item" data-tab="password-content" onclick="switchTab(this, 'password-content')">Change Password</button>
        <button type="button" class="nav-item" data-tab="bookings-content" onclick="switchTab(this, 'bookings-content')">My Bookings</button>
      </nav>

      <button type="button" class="profile-btn logout-btn nav-logout" id="logout-btn">Log out</button>
    </aside>

    <main class="profile-content">

      <div class="tab-panel active" id="personal-info-content">
        <div class="tab-panel-inner">
          <h2>Personal Info</h2>
          <form id="profile-form">
            <div class="input-grid">
              <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="" readonly />
              </div>
              <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="" readonly />
              </div>
              <div class="input-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="" readonly />
              </div>
            </div>

            <div id="company-extra-info" style="display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid #FFC0CB;">
              <h3 style="margin-bottom: 12px; font-size: 15px; color: #000000;">Company Details</h3>
              <div class="input-grid">
                <div class="input-group">
                  <label for="company-services">Services:</label>
                  <input type="text" id="company-services" name="company-services" value="" readonly placeholder="e.g. Vulcanizare, Schimb Ulei" />
                </div>
                <div class="input-group">
                  <label for="company-mechanics">Employees/Mechanics (comma separated)</label>
                  <input type="text" id="company-mechanics" name="company-mechanics" value="" readonly placeholder="e.g. Ion, Vasile" />
                </div>
              </div>
            </div>

            <button type="button" class="profile-btn secondary-btn" id="edit-btn">Edit details</button>

            <div id="action-buttons" class="action-buttons-container">
              <button type="submit" class="profile-btn save-btn" id="save-btn">Save Changes</button>
              <button type="button" class="profile-btn cancel-btn" id="cancel-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <div class="tab-panel section-my-car" id="section-my-car">
        <div class="tab-panel-inner">
          <div class="my-car-header-row">
            <h2>My Car</h2>
            <button type="button" class="add-car-btn" onclick="document.getElementById('add-car-form-container').style.display = 'flex';">Add</button>
          </div>

          <div id="add-car-form-container" class="add-car-form-container">
            <form id="add-car-form">
              <h3>Add a new car</h3>
              <div class="input-row">
                <div class="input-group">
                  <label for="newCarMake">Make</label>
                  <input type="text" id="newCarMake" name="newCarMake" placeholder="e.g. Dacia" required />
                </div>
                <div class="input-group">
                  <label for="newCarModel">Model</label>
                  <input type="text" id="newCarModel" name="newCarModel" placeholder="e.g. Duster" required />
                </div>
              </div>
              <div class="input-row">
                <div class="input-group">
                  <label for="newCarYear">Year</label>
                  <input type="number" id="newCarYear" name="newCarYear" placeholder="e.g. 2022" required />
                </div>
                <div class="input-group">
                  <label for="newCarEngine">Engine</label>
                  <input type="text" id="newCarEngine" name="newCarEngine" placeholder="e.g. 1.3 TCe" required />
                </div>
              </div>
              <div class="add-car-actions">
                <button type="submit" class="profile-btn save-btn">Save Car</button>
                <button type="button" class="profile-btn cancel-btn" onclick="document.getElementById('add-car-form-container').style.display = 'none';">Cancel</button>
              </div>
            </form>
          </div>
          <div id="cars-list-container"></div>
        </div>
      </div>

      <div class="tab-panel" id="password-content">
        <div class="tab-panel-inner tab-panel-inner-narrow">
          <h2>Change Password</h2>
          <form id="password-form">
            <div class="input-group">
              <label for="currentPassword">Current password</label>
              <div class="password-wrapper">
                <input type="password" id="currentPassword" name="currentPassword" required />
                <button type="button" class="toggle-btn" data-target="currentPassword">Show</button>
              </div>
            </div>
            <div class="input-group">
              <label for="newPassword">New password</label>
              <div class="password-wrapper">
                <input type="password" id="newPassword" name="newPassword" required />
                <button type="button" class="toggle-btn" data-target="newPassword">Show</button>
              </div>
            </div>
            <button type="submit" class="profile-btn">Update password</button>
          </form>
        </div>
      </div>

      <div class="tab-panel" id="bookings-content">
        <div class="tab-panel-inner">
          <h2>My Bookings</h2>
          <div id="bookings-list-container">
            <p class="history-empty-text">Loading bookings...</p>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    function toggleAccordion(contentId, headerElement) {
      const content = document.getElementById(contentId);
      const icon = headerElement.querySelector('.toggle-icon');

      if (content.style.display === 'block') {
        content.style.display = 'none';
        icon.textContent = '+';
      } else {
        content.style.display = 'block';
        icon.textContent = '-';
      }
    }

    function switchTab(navBtn, tabId) {
      document.querySelectorAll('.tab-panel').forEach((panel) => {
        panel.classList.remove('active');
      });
      document.querySelectorAll('.nav-item').forEach((item) => {
        item.classList.remove('active');
      });

      const targetPanel = document.getElementById(tabId);
      targetPanel.style.display = '';
      targetPanel.classList.add('active');
      navBtn.classList.add('active');
    }
  </script>
  <script src="Profile.js"></script>
</body>
</html>
