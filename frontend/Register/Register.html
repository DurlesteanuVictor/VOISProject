<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account</title>
  <link rel="stylesheet" href="Register.css" />
  <link rel="stylesheet" href="../Login/Login.css" />
</head>
<body>

  <div class="login-container register-container" id="register-container">
    <h1 class="login-title">Create Account</h1>
    
    <form id="register-form">
      <div class="input-group">
        <label for="user">Name:</label>
        <input type="text" id="user" name="user" placeholder="John Smith" required />
      </div>

      <div class="input-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="email@gmail.com" required />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
          <button type="button" id="toggle-password" class="toggle-btn">Show</button>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar" id="password-strength-bar"></div>
        </div>
        <span class="password-strength-label" id="password-strength-label"></span>
      </div>

      <div class="input-group">
        <label for="telephoneNumber">Phone Number</label>
        <input type="tel" id="telephoneNumber" name="telephoneNumber" placeholder="XXXXXXXXX" required />
      </div>
      <div id="car-details-section">
        <h3>Car Details:</h3>
        
        <div class="input-group">
          <label for="carName">Make and Model</label>
          <input type="text" id="carName" name="carName" placeholder="e.g. Dacia Logan" />
        </div>

        <div class="input-group">
          <label for="carYear">Year of Manufacture</label>
          <input type="number" id="carYear" name="carYear" min="1900" max="2027" placeholder="e.g. 2015" />
        </div>

        <div class="input-group">
          <label for="carEngine">Engine Type</label>
          <input type="text" id="carEngine" name="carEngine" placeholder="e.g. 1.5 dCi" />
        </div>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="login-btn" id="register-btn">
        <span id="register-btn-text">Create Account</span>
      </button>

      <div class="company-register-section">
        <span class="company-register-text">Are you a new auto service on the platform?</span>
        <br>
        <a href="../Register Company/RegisterCompany.html" class="company-register-btn">Register Your Company</a>
      </div>
    </form>
  </div>
  <script src="Register.js"></script>
</body>
</html>
