<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Creează cont</title>
  <link rel="stylesheet" href="Register.css" />
  <link rel="stylesheet" href="../Login/Login.css" />
</head>
<body>

  <div class="login-container register-container" id="register-container">
    <h1 class="login-title">Creează cont</h1>
    
    <form id="register-form">
      <div class="input-group">
        <label for="user">Nume:</label>
        <input type="text" id="user" name="user" placeholder="Ion Popescu" required />
      </div>

      <div class="input-group">
        <label for="email">Adresă de email:</label>
        <input type="email" id="email" name="email" placeholder="email@gmail.com" required />
      </div>

      <div class="input-group">
        <label for="password">Parolă</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Minim 6 caractere" required />
          <button type="button" id="toggle-password" class="toggle-btn">Arată</button>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar" id="password-strength-bar"></div>
        </div>
        <span class="password-strength-label" id="password-strength-label"></span>
      </div>

      <div class="input-group">
        <label for="telephoneNumber">Număr de telefon</label>
        <input type="tel" id="telephoneNumber" name="telephoneNumber" placeholder="XXXXXXXXX" required />
      </div>
      <div id="car-details-section">
        <h3>Detalii mașină:</h3>
        
        <div class="input-group">
          <label for="carName">Marcă și model</label>
          <input type="text" id="carName" name="carName" placeholder="exemplu: Dacia Logan" />
        </div>

        <div class="input-group">
          <label for="carYear">An de fabricație</label>
          <input type="number" id="carYear" name="carYear" min="1900" max="2027" placeholder="exemplu: 2015" />
        </div>

        <div class="input-group">
          <label for="carEngine">Tip motor</label>
          <input type="text" id="carEngine" name="carEngine" placeholder="exemplu: 1.5 dCi" />
        </div>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="login-btn" id="register-btn">
        <span id="register-btn-text">Creează cont</span>
      </button>

      <div class="company-register-section">
        <span class="company-register-text">Ești un service auto nou pe platformă?</span>
        <br>
        <a href="../Register Company/RegisterCompany.html" class="company-register-btn">Înregistrează Compania</a>
      </div>
    </form>
  </div>
  <script src="Register.js"></script>
</body>
</html>
