<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="Login.css" />
</head>
<body>

  <div class="login-container" id="login-container">
    <h1 class="login-title">Autentificare</h1>

    <form id="login-form">
      <div class="input-group">
        <label for="username">Utilizator</label>
        <input type="email" id="username" name="username" placeholder="Introdu adresa de email" required />
      </div>

      <div class="input-group">
        <label for="password">Parolă</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Introdu parola" required />
          <button type="button" id="toggle-password" class="toggle-btn">Arată</button>
        </div>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="login-btn" id="login-btn">
        <span id="login-btn-text">Login</span>
      </button>

      <div class="register-redirect">
        <span class="redirect-text">Nu ai cont?</span>
        <br>
        <a href="../Register/Register.html" class="redirect-link">Creează un cont</a>
      </div>
    </form>
  </div>

  <script src="Login.js"></script>
</body>
</html>
