<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="Login.css" />
</head>
<body>

  <div class="login-container">
    <h1 class="login-title">Autentificare</h1>

    <form id="login-form">
      <div class="input-group">
        <label for="username">Utilizator</label>
        <input type="email" id="username" name="username" placeholder="Introdu adresa de email" required />
      </div>

      <div class="input-group">
        <label for="password">Parolă</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Introdu parola" required />
          <button type="button" id="toggle-password" class="toggle-btn">Arată</button>
        </div>
      </div>

      <button type="submit" class="login-btn">Login</button>
      <button type="button" class="login-btn" id="create-account-btn" style="background-color: transparent; color: #0096FF; border: 1px solid #0096FF; margin-top: 10px;">Create account</button>
    </form>
  </div>

  <script src="Login.js"></script>
</body>
</html>
