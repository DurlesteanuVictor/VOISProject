<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Înregistrează-ți compania</title>
  <link rel="stylesheet" href="../Login/Login.css" />
  <link rel="stylesheet" href="../Register/Register.css" />
  <link rel="stylesheet" href="RegisterCompany.css" />
</head>
<body>
  <div class="login-container register-container" id="company-container">
    <h1 class="login-title">Înregistrează-ți compania</h1>
    <form id="company-form">
      <div class="input-group">
        <label for="name">Numele companiei</label>
        <input type="text" id="name" required minlength="2" placeholder="ex: AutoService SRL" />
      </div>
      <div class="input-group">
        <label for="address">Adresă</label>
        <input type="text" id="address" required minlength="5" placeholder="Str. Exemplu nr. 1" />
      </div>
      <div class="input-group">
        <label for="contact_info">Telefon / Email</label>
        <input type="text" id="contact_info" required placeholder="contact@service.ro" />
      </div>
      <div class="input-group">
        <label for="description">Descrierea companiei</label>
        <textarea id="description" rows="4" class="company-textarea" placeholder="Scrie o scurtă descriere despre service..."></textarea>
      </div>
      <button type="submit" class="login-btn" id="company-submit-btn">
        <span id="company-submit-btn-text">Înregistrează Compania</span>
      </button>
    </form>
    <p id="message-box"></p>
  </div>
  <script src="RegisterCompany.js"></script>
</body>
</html>
