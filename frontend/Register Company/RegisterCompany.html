<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register your Company</title>
  <link rel="stylesheet" href="../Login/Login.css" />
  <link rel="stylesheet" href="../Register/Register.css" />
  <link rel="stylesheet" href="RegisterCompany.css" />
</head>
<body>
  <div class="login-container register-container" id="company-container">
    <h1 class="login-title">Register your Company</h1>
    <form id="company-form">
      <div class="input-group">
        <label for="name">Company Name</label>
        <input type="text" id="name" required minlength="2" placeholder="e.g. AutoService Inc." />
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter password" minlength="6" />
      </div>

      <div class="input-group">
        <label for="address">Address</label>
        <input type="text" id="address" required minlength="5" placeholder="123 Example St." />
      </div>

      <div class="input-group">
        <label for="contact_info">Phone / Email</label>
        <input type="text" id="contact_info" required placeholder="contact@service.com" />
      </div>

      <div class="input-group">
        <label for="description">Company Description</label>
        <textarea id="description" rows="4" class="company-textarea" placeholder="Write a short description of your service..."></textarea>
      </div>

      <div class="input-group">
        <label>Select Offered Services</label>
        <div id="register-tags-container" class="tags-container">
          <span class="service-tag">Schimb Ulei</span>
          <span class="service-tag">Revizie Frâne</span>
          <span class="service-tag">Diagnoză Auto</span>
          <span class="service-tag">Schimb Distribuție</span>
          <span class="service-tag">Vulcanizare</span>
          <span class="service-tag">Climatizare AC</span>
        </div>
      </div>

      <button type="submit" class="login-btn" id="company-submit-btn">
        <span id="company-submit-btn-text">Register Company</span>
      </button>
    </form>
    <p id="message-box"></p>
  </div>
  <script src="RegisterCompany.js"></script>
</body>
</html>
